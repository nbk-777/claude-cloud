ხები: 32.04 მისაღები, 10.26 საბავშვო, 16.01 მთავარი საძინებელი, 5.48 სააბაზანო, 7.11 ჰოლი, 3.40 გარდერობი (სახელები — დაშვება, შეცვლადია).","ჭკვიანი თერმოსტატები ზუსტად 4 ოთახშია: მისაღები, საბავშვო, მთავარი საძინებელი, სააბაზანო.","3-ძარღვიანი თერმოსტატის კაბელები დაგებულია ამ ოთახებიდან (ვარგისიანობა/ძარღვების ფუნქცია დაუდასტურებელია).","ჰოლს და გარდერობს თერმოსტატი არ აქვს, მაგრამ აქვს კონტურები.","ქვაბი: Ariston Genus ONE 24 kW (კომბი, კონდენსაციური, კედლის) — მარცხენა აივანზე, თბოიზოლირებულ კარადაში.","კოლექტორი ნაყიდი არ არის; მისი ადგილი უცნობია.","ცხელი წყალი უნდა მივიდეს სააბაზანოს შხაპამდე.","საჭიროა ოთახების დამოუკიდებელი მართვა.","(მე-2 შეტყობინება) თერმოსტატი ×4: Beok 220V Wi-Fi, წყლის იატაკის გათბობისთვის, 3A, Tuya — ჯერ არ არის დამონტაჟებული.","(მე-2) აქტუატორი ×14: 230V, NC, M30×1.5, ≈2–3 W, იღება ≈3–5 წთ-ში.","(მე-2) 8-ზონიანი გაყვანილობის ცენტრი: 220V შესასვლელი (L, N), 15A ფუზი, ზონაზე L / N / სიგნალი / აქტუატორის წყვილი, ტუმბოს გამოსავალი L1/N1, ქვაბის რელე NO/COM/NC, DIP დაყოვნება, PE.","(მე-2) კოლექტორი 14 კონტურით, ნაკადმზომებით; აქტუატორები მიწოდების კოლექტორზე, დაბრუნებაზე ხელის თავსახურები.","(მე-2) 3-ძარღვიანი კაბელი თითო ოთახიდან კოლექტორის ადგილამდე.","(მე-2) TA1: ქარხნული ჯამპერი მოიხსნება, მხოლოდ მშრალი კონტაქტი, არასოდეს 230V."],$M=["ფართების წინააღმდეგობა: გეგმა — მისაღები 32.04, მთ. საძინებელი 16.01, სააბაზანო 5.48, საბავშვო 10.26, ჰოლი 7.11; მე-2 შეტყობინება — 30 / 21 / 10 / 9 მ², ჰოლი არ არის ნახსენები. მოდელში გამოყენებულია გეგმის ფართები.","თერმოსტატები: 1-ლი შეტყობინება — „არსებობს“, მე-2 — „ჯერ არ არის დამონტაჟებული“. მოდელი: დაგეგმილი Beok 220V Wi-Fi.","სააბაზანოს კონტურები: 1-ლი — 1, მე-2 — 2. ნაგულისხმევი 6/3/2/1/1/1; ალტერნატივა (6/3/2/2/0/1) ერთი ღილაკით — „კონტურების რუკა“ გვერდზე.","კონტური→ოთახი ზუსტი რუკა დაუდასტურებელია (მომხმარებელმა იცის — შეიყვანეთ ცხრილში).","გაყვანილობის ცენტრის ზონაზე აქტუატორების დენის ლიმიტი დაუდასტურებელია (მისაღებში 6 + ჰოლი/გარდერობი, თითო ≈2–3 W).","თერმოსტატის კლემების ზუსტი წარწერები მოდელზეა დამოკიდებული.","3-ძარღვიანი კაბელის ძარღვები: ზოგადი მოდელი L / N / სიგნალი — გადაამოწმეთ მწარმოებლის ინსტრუქციით.","ქვაბის რელეს (NO/COM) მშრალი კონტაქტის ქცევა უნდა დადასტურდეს TA1-თან მიერთებამდე. 230V არასოდეს TA1-ზე (GB ინსტრ. გვ.11: 12V DC, მხოლოდ volt-free).","DIP დაყოვნების რეალური მნიშვნელობები უცნობია — მომხმარებლის ბრიფი: DIP 0 / 2 / 5 წთ; ნაგულისხმევი 5 წთ (დაშვება).","ტუმბოს გამოსავალი L1/N1 არ გამოიყენება (ქვაბს საკუთარი ტუმბო აქვს), თუ მომხმარებელი არ ჩართავს.","შერევის კვანძის საჭიროება, ქვაბის ტუმბოს სიმძლავრე 14 კონტურისთვის — დაუდასტურებელი.","ნაკადმზომების ბარი: მე-2 შეტყობინებით აქტუატორები მიწოდებაზეა, დაბრუნებაზე თავსახურები — ნაკადმზომის ადგილი დახატულია დაბრუნებაზე (დაშვება).","თერმო-კარადა აივანზე: ყინვა, კონდენსატი, ვენტილაცია, საკვამური — Ariston-ის თანხმობა.","ელექტროგაყვანილობა — კვალიფიციური ელექტრიკოსი; ქვაბის მიერთებები — Ariston-ის სერვისის ტექნიკოსი."],KM=["ოთახების სახელები ფართების მიხედვით (შეცვლადია).","ჰოლის კონტური არარეგულარულია — მიახლოებულია 3 მართკუთხედით (დახატული ≈7.2 მ², გეგმაზე 7.11 მ²). საბავშვოს სიღრმე 3.80 მ გამოთვლილია 10.26/2.70-დან.","თერმოსტატების, კოლექტორის, კონტროლერის, შხაპის ადგილები და ყველა მილის/კაბელის მარშრუტი — დაშვება (გეგმაზე არ ჩანს).","კონტური→ოთახი ნაგულისხმევი განაწილება ფართის პროპორციულია (≈5.3 მ²/კონტური): 6/3/2/1/1/1.","კონტურის მილის ფორმა (სერპანტინი) — ვიზუალური მოდელი; რეალური გაყვანილობა უცნობია.","აქტუატორი: 2-სადენიანი, NC, 230V (მე-2 შეტყობინება, პროდუქტი დაუდასტურებელი), თითო კონტურზე ერთი; გახსნა 90 წმ დაყოვნება + 150 წმ სვლა ≈ 4 წთ.","გაყვანილობის ცენტრის რელე (COM–NO → TA1) იკეტება DIP დაყოვნების შემდეგ (DIP 0/2/5 წთ, ნაგულისხმევი 5 წთ) — ბოლო-გადამრთველის უკუკავშირი არ არის მოდელირებული.","3-ძარღვიანი კაბელი: ძარღვი 1 = L, 2 = N (თერმოსტატის კვება), 3 = თერმოსტატის სიგნალი ცენტრის ზონის კლემაზე — ზოგადი მოდელი, გადასამოწმებელი.","ჰოლის/გარდერობის აქტუატორები პარალელურად მიერთებულია არჩეული ოთახის ზონის აქტუატორის წყვილზე.","ცსწ-ს პრიორიტეტი სამსვლიანი სარქვლით — ტიპიური
