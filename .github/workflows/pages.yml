# Builds the single-file app and publishes it to GitHub Pages.
# Works with either Pages setting:
#  - "Deploy from a branch: main"  → job publish-branch commits the built index.html to main
#  - "GitHub Actions"              → job deploy publishes the Pages artifact
# Source code lives on the default branch; main holds only the built app.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/great-pasteur-vsm2si]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Try to switch Pages on (source: GitHub Actions) if it is not enabled yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The github-pages environment accepts deployments only from the default branch.
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Keeps main = built app, for Pages in "Deploy from a branch: main" mode.
  publish-branch:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built app to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/site" origin/main
          cp dist/index.html "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git add -A
          if git diff --cached --quiet; then echo "main already up to date"; exit 0; fi
          git commit -m "Publish built app ($(echo "$GITHUB_SHA" | cut -c1-7))"
          git push origin HEAD:main
